# Local development database only. Not for staging or production.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: taneja
      POSTGRES_PASSWORD: taneja
      POSTGRES_DB: taneja_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro

volumes:
  pgdata:
